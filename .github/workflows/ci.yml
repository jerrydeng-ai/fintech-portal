name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # next build prerenders pages that touch the DB; create an empty migrated one first
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
